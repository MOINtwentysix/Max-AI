services:
  max:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-ai-buddy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-max-secure-production-secret-change-this}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
    extra_hosts:
      # Allows connecting to Ollama running directly on host
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent local SQLite database & backups
      - max_data:/app/data

volumes:
  max_data:
    name: max_ai_buddy_data
